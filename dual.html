<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="utf-8">
    <title>本地联机测试（双人）</title>
    <style>
        html, body { margin: 0; height: 100%; background: #111; color: #ddd; font-family: Helvetica, Arial, sans-serif; }
        .wrap { display: flex; height: calc(100% - 28px); gap: 4px; }
        iframe { flex: 1; border: 0; background: #000; }
        .bar { height: 28px; line-height: 28px; padding: 0 10px; font-size: 13px; }
    </style>
</head>
<body>
    <div class="bar">左边玩家 1，右边玩家 2。两边都选队伍并点 ONLINE：一边“创建房间”，另一边输入房间码“加入房间”。默认走 WebRTC（需要信令服务器）；加 ?net=bc 改用 BroadcastChannel。</div>
    <div class="wrap">
        <iframe id="p1"></iframe>
        <iframe id="p2"></iframe>
    </div>
    <script>
        // 把本页的 URL 参数（?net=bc、?sig=...）转给两个玩家
        var q = location.search ? location.search.slice(1) + "&" : "";
        document.getElementById("p1").src = "page.html?" + q + "p=1";
        document.getElementById("p2").src = "page.html?" + q + "p=2";
    </script>
</body>
</html>
